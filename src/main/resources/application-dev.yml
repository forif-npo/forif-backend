spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RDS_URL}/forif_dev
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    hikari:
      data-source-properties:
        rewriteBatchedStatements: true


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate.SQL: debug