spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RDS_URL:jdbc:mysql://127.0.0.1:3307}/forif_dev
    username: ${RDS_USERNAME:root}
    password: ${RDS_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:D7s8f9G0h1j2k3L4z5x6c7v8b9n0m1Q2W3E4R5T6Y7u=}

notification:
  api-key: ${SMS_API_KEY:test}
  api-secret: ${SMS_API_SECRET:test}
  pf-id: ${SMS_PF_ID:test}
  sender-number: ${SMS_SENDER_NUMBER:01000000000}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
