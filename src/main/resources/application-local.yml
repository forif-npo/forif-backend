spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:localdb
    username: sa
    password:

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: local-dev-jwt-secret-key-for-testing-purposes-only

logging:
  level:
    org.hibernate.SQL: debug