spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-jwt-secret-key-for-testing-purposes-only

logging:
  level:
    org.hibernate.SQL: debug
