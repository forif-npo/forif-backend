spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${RDS_URL}/forif
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    hikari:
      # 대량 데이터 insert 시 성능 향상을 위한 옵션
      data-source-properties:
        rewriteBatchedStatements: true

  flyway:
    # 운영 DB가 스키마의 기준이다. 부팅 시 마이그레이션을 적용한 뒤
    # 아래 ddl-auto: validate 가 엔티티와의 일치를 재확인한다.
    enabled: true

  jpa:
    show-sql: false # 운영 환경에서 로그 폭발 방지
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100 # Batch insert 성능 최적화

logging:
  level:
    org.hibernate.SQL: info
