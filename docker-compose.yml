services:
  forif-backend:
    # GitHub Secrets의 DOCKER_USERNAME을 사용하여 이미지를 가져옵니다.
    image: ${DOCKER_USERNAME}/forif-app:latest
    container_name: forif-backend
    ports:
      - "8080:8080"
    # GitHub Actions가 생성한 .env 파일을 읽어 환경변수를 주입합니다.
    env_file:
      - .env
    # 컨테이너가 비정상 종료 시 자동으로 재시작되도록 설정합니다.
    restart: always
    # 로그 확인을 용이하게 하기 위한 설정입니다.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"