name: FORIF Backend CI/CD

on:
  push:
    branches: [ "main", "release", "dev" ]
  pull_request:
    branches: [ "main", "release", "dev" ]

jobs:
  # 1. 빌드 및 테스트 (모든 브랜치 공통)
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and Test with Gradle
        run: ./gradlew build --no-daemon

  # 2. 배포 (release 브랜치에 push 되었을 때만 실행)
  deploy:
    needs: build-test
    # 오직 release 브랜치에 push 이벤트가 발생했을 때만 배포 진행
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/forif-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/forif-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/forif-backend
            
            # 환경변수 주입 (S3_BUCKET_RELEASE 사용)
            echo "SPRING_PROFILES_ACTIVE=release" > .env
            echo "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" >> .env
            echo "RDS_URL=${{ secrets.RDS_URL }}" >> .env
            echo "RDS_USERNAME=${{ secrets.RDS_USERNAME }}" >> .env
            echo "RDS_PASSWORD=${{ secrets.RDS_PASSWORD }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "SMS_API_KEY=${{ secrets.SMS_API_KEY }}" >> .env
            echo "SMS_API_SECRET=${{ secrets.SMS_API_SECRET }}" >> .env
            echo "SMS_PF_ID=${{ secrets.SMS_PF_ID }}" >> .env
            echo "SMS_SENDER_NUMBER=${{ secrets.SMS_SENDER_NUMBER }}" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env

            docker-compose pull
            docker-compose up -d